<div class="property-panel">
  <h3>Eigenschaften</h3>

  <div *ngFor="let obj of selected" class="obj-properties">

    <div *ngIf="isRect(obj)" class="field">
      <label>Name</label>
      <input type="text" [(ngModel)]="obj.name" (ngModelChange)="onRecValueChange()" (keydown)="$event.stopPropagation()">
      <label>Controller</label>
      <select [(ngModel)]="obj.controller" (ngModelChange)="onRecValueChange()" (keydown)="$event.stopPropagation()">
        <option value="">-- Kein Controller --</option>
        <option *ngFor="let ctrl of availableControllers()" [value]="ctrl">
          {{ ctrl }}
        </option>
      </select>
      <label>Transit-Point</label>
      <select [(ngModel)]="obj.transitPoint" (ngModelChange)="onRecValueChange()">
        <option [ngValue]="true">Ja</option>
        <option [ngValue]="false">Nein</option>
      </select>
      <label>Breite</label>
      <input type="number" [(ngModel)]="obj.width" (ngModelChange)="onRecValueChange()">
      <label>Höhe</label>
      <input type="number" [(ngModel)]="obj.height" (ngModelChange)="onRecValueChange()">
    </div>

    <div *ngIf="isArrow(obj)" class="field">
      <label>Typ</label>
      <select [(ngModel)]="obj.type" (ngModelChange)="onArrowValueChange()">
        <option value="roller">Rollenbahn</option>
        <option value="belt">Gurtförderer</option>
        <option value="chain">Kettenförderer</option>
      </select>

      <label>Richtung</label>
      <select [(ngModel)]="obj.direction" (ngModelChange)="onArrowValueChange()">
        <option value="S">straight</option>
        <option value="R">right</option>
        <option value="L">left</option>
      </select>

      <label>Geschwindigkeit</label>
      <input type="number" [(ngModel)]="obj.speed" (ngModelChange)="onArrowValueChange()">

      <label>Kosten</label>
      <input type="number" [(ngModel)]="obj.cost" (ngModelChange)="onArrowValueChange()">
    </div>

    <div *ngIf="isAisle(obj)" class="field">
      <h4 class="sub-title">Gasse: {{obj.name}}</h4>

      <label>RBG Name</label>
      <input type="text"
             [(ngModel)]="obj.rbg.name"
             (ngModelChange)="onAisleValueChange()"
             (keydown)="$event.stopPropagation()">

      <label>Position (0.0 - 1.0)</label>
      <input type="number" step="0.1" min="0" max="1"
             [(ngModel)]="obj.rbg.positionOffset"
             (ngModelChange)="onAisleValueChange()">

      <label>RBG Breite</label>
      <input type="number" [(ngModel)]="obj.rbg.width" (ngModelChange)="onAisleValueChange()">

      <label>RBG Höhe</label>
      <input type="number" [(ngModel)]="obj.rbg.height" (ngModelChange)="onAisleValueChange()">
    </div>

  </div>
</div>
