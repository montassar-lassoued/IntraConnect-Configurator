<svg class="canvas"
     (mousedown)="onCanvasDown($event)"
     (mousemove)="onMouseMove($event)"
     (contextmenu)="$event.preventDefault()">

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666" />
    </marker>
  </defs>

  <g *ngIf="currentView === 'visualization'">
  <g *ngFor="let aisle of (editor.getAisles$() | async); trackBy: trackById">
    <rect class="aisle-track"
          [attr.x]="aisle.x" [attr.y]="aisle.y"
          [attr.width]="aisle.width" [attr.height]="aisle.height"
          [class.selected]="isSelected(aisle)"
          (mousedown)="startDrag($event, aisle)">
    </rect>
    <text [attr.x]="aisle.x + aisle.width / 2"
          [attr.y]="aisle.y - 5"
          text-anchor="middle"
          style="font-family: Arial; font-size: 14px; font-weight: bold; fill: #555; pointer-events: none; user-select: none;">
      {{ aisle.name }}
    </text>
    <rect *ngIf="aisle.rbg"
          class="rbg-unit"
          [attr.x]="aisle.x + (aisle.width * aisle.rbg.positionOffset) - (aisle.rbg.width / 2)"
          [attr.y]="aisle.y + (aisle.height / 2) - (aisle.rbg.height / 2)"
          [attr.width]="aisle.rbg.width" [attr.height]="aisle.rbg.height">
    </rect>
    <rect *ngIf="isSelected(aisle)"
          [attr.x]="aisle.x + aisle.width - 8"
          [attr.y]="aisle.y + aisle.height - 8"
          width="16" height="16"
          fill="blue"
          style="cursor: nwse-resize"
          (mousedown)="$event.stopPropagation(); startResize($event, aisle)">
    </rect>
  </g>

  <line *ngIf="arrowStartPoint"
        [attr.x1]="arrowStartPoint.x" [attr.y1]="arrowStartPoint.y"
        [attr.x2]="currentMousePos.x" [attr.y2]="currentMousePos.y"
        stroke="orange"
        stroke-dasharray="5,5"
        stroke-width="2"
        style="pointer-events: none;">
  </line>

  <g *ngFor="let a of (editor.getArrows$() | async); trackBy: trackById">
    <path [attr.d]="getArrowPath(a)"
          stroke="transparent"
          stroke-width="30"
          fill="none"
          (dblclick)="addWaypoint($event, a)"
          (mousedown)="startDrag($event, a)"
          style="cursor: pointer;">
    </path>

    <path [attr.d]="getArrowPath(a)"
          class="conveyor-base"
          stroke="#222"
          stroke-width="20"
          fill="none">
    </path>

    <path [attr.d]="getArrowPath(a)"
          [class]="'conveyor type-' + a.type"
          [class.selected]="isSelected(a)">
    </path>

    <path *ngIf="a.speed > 0"
          [attr.d]="getArrowPath(a)"
          [class]="'flow-line direction-' + a.direction"
          [style.animation-duration]="(2 / a.speed) + 's'">
    </path>

    <ng-container *ngIf="isSelected(a)">
      <circle *ngFor="let wp of a.waypoints; let i = index"
              [attr.cx]="wp.x" [attr.cy]="wp.y" r="6"
              fill="white" stroke="blue" stroke-width="2"
              (mousedown)="startDragWaypoint($event, a, i)"
              style="cursor: move;">
      </circle>
    </ng-container>
  </g>

  <g *ngFor="let r of (editor.getRects$() | async); trackBy: trackById">
    <rect [attr.x]="r.x" [attr.y]="r.y"
          [attr.width]="r.width" [attr.height]="r.height"
          [class.selected]="isSelected(r)"
          fill="white" stroke="blue" stroke-width="2"
          (mousedown)="startDrag($event, r); $event.stopPropagation()"
          (mouseenter)="hoveredRect = r"
          (mouseleave)="hoveredRect = null">
    </rect>

    <text [attr.x]="r.x + r.width / 2"
          [attr.y]="r.y + r.height / 2"
          dominant-baseline="central"
          text-anchor="middle"
          pointer-events="none"
          style="font-family: Arial; font-size: 12px; fill: #333; user-select: none;">
      {{ r.name }}
    </text>

    <rect *ngIf="isSelected(r)"
          [attr.x]="r.x + r.width - 6" [attr.y]="r.y + r.height - 6"
          width="12" height="12" fill="blue" style="cursor: nwse-resize"
          (mousedown)="$event.stopPropagation(); startResize($event, r)">
    </rect>

    <ng-container *ngIf="hoveredRect === r || arrowStartPoint">
      <circle *ngFor="let p of getConnectors(r)"
              [attr.cx]="p.x" [attr.cy]="p.y" r="6"
              fill="orange" class="connector"
              style="cursor: crosshair; pointer-events: all;"
              (mousedown)="onConnectorClick($event, p, r); $event.stopPropagation()">
      </circle>
    </ng-container>
  </g>
  </g>

  <g *ngIf="currentView === 'processors'">
  <g *ngFor="let p of (editor.getProcessors$() | async); trackBy: trackById"
     (mousedown)="select(p); $event.stopPropagation()"
     [attr.transform]="'translate(' + p.x + ',' + p.y + ')'"
     style="cursor: move">
    <circle r="15" fill="#3498db" [attr.stroke]="isSelected(p) ? 'orange' : 'none'" stroke-width="3" />
    <text y="25" text-anchor="middle" font-size="10" font-weight="bold" style="user-select: none;">
      {{p.name}}
    </text>
  </g>
  </g>

</svg>
